<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A personal notebook of ideas, notes, and experiments." />
    <title>Writting · Notes in progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pontano+Sans:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-nav">
        <nav aria-label="Primary navigation">
          <a class="active" href="#writing">Writing</a>
          <a href="https://github.com/" rel="noreferrer">GitHub</a>
        </nav>
      </div>
      <div class="brand">
        <a class="wordmark" href="./">writting</a>
        <span class="tagline">notes from the lab</span>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Writing / index</p>
        <h1 id="page-title">Thinking out loud,<br /><em>one note at a time.</em></h1>
        <p class="lede">Essays, experiments, and unfinished thoughts about the things I’m learning.</p>
      </section>

      <section class="writing" id="writing" aria-labelledby="writing-title">
        <div class="section-heading">
          <h2 id="writing-title">Latest writing</h2>
          <span id="post-count" class="post-count"></span>
        </div>
        <div id="post-list" class="post-list" aria-live="polite"></div>
      </section>

      <article id="post-view" class="post-view" hidden>
        <a class="back-link" href="#writing">← All writing</a>
        <div id="post-content"></div>
      </article>
    </main>

    <footer class="site-footer">
      <span>Built in public.</span>
      <span>Markdown · LaTeX · code · images</span>
    </footer>

    <script>
      window.MathJax = {
        tex: { inlineMath: [["$", "$"]], displayMath: [["$$", "$$"]] },
        options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"] }
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </body>
</html>
